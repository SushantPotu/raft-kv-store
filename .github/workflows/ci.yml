name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        run: buf lint
      - name: Ensure generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- pkg/raftpb pkg/kvpb pkg/metapb

  # AWS-touching steps (terraform plan/apply against a real account) are
  # intentionally NOT part of the default push/PR triggers above, to avoid
  # incurring cloud cost or requiring secrets on every commit. Run manually
  # via the Actions tab when Workstream I's Terraform is ready to validate.
  aws-terraform-validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate (dev env, no credentials needed)
        working-directory: deploy/terraform/envs/dev
        run: |
          terraform init -backend=false
          terraform validate
