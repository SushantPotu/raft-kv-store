syntax = "proto3";

package raft.v1;

option go_package = "github.com/SushantPotu/raft-kv-store/pkg/raftpb;raftpb";

// RaftTransport carries peer-to-peer consensus RPCs between nodes hosting
// the same shard's Raft group. Every RPC carries shard_id so a single
// transport/connection can multiplex messages for many independently
// managed Raft groups (Multi-Raft) — this is the seam between a
// single-shard deployment and a sharded one; the wire protocol does not
// change between them.
service RaftTransportService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // Streamed because snapshots can be large (full keyspace dump for a shard).
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_NORMAL = 1;
  ENTRY_TYPE_CONF_CHANGE = 2;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

message RequestVoteRequest {
  string shard_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  string shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On rejection: hints for fast conflict backtracking (Raft's "nextIndex
  // optimization") instead of decrementing nextIndex one at a time.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
  // Set when this node knows the current leader, so a client (or peer)
  // that reached the wrong node can be redirected directly.
  string leader_hint = 5;
}

message ConfState {
  repeated string voters = 1;
}

message InstallSnapshotRequest {
  string shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  ConfState conf_state = 6;
  uint64 offset = 7;
  bytes data = 8;
  bool done = 9;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
